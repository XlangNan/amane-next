<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Amane-next brand mark: warm gradient badge (#ffa94d → #e8590c), letterform A with
       play-triangle counter, plus a forward chevron for "next". Distinct from the blue upstream mark. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#ffa94d"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <g transform="translate(3 6) scale(1)">
    <path
      d="M9 0 L0 18 H18 Z"
      fill="#fff"
      stroke="#fff"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <path
      d="M7 8.5 L7 14.5 L12.6 11.5 Z"
      fill="url(#g)"
      stroke="url(#g)"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
  </g>
  <path
    d="M23.5 10.5 L28 15 L23.5 19.5"
    stroke="#fff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
